<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szerviznapló</title>
  <link rel="stylesheet" href="CSS/style.css">
  <script src="JS/fo_script.js" defer></script>
</head>

<body>
  <header>
    <button id="clear_storage" onclick="localStorage.clear();location.reload();"> Localstorage clear </button>
    <h1>Karbantartás</h1>
    <p>Szerviznapló</p>
  </header>

  <nav>
    <a href="#jarmu">Jármű</a>
    <a href="#elozmenyek">Előzmények</a>
    <a href="Oldalak/Szerviz_felvetel.html">Új szerviz</a>
  </nav>

  <main>
    <section id="jarmu">
      <h2>Jármű lista</h2>
        <form name="jarmuvek" id="jarmuvek"></form>
      <div id="motor_kepek">
        <figure id="kawasaki_kep">
            <img src="Kepek/Kawa_1.jpg">
            <figcaption>Kawasaki Versys 650</figcaption>
        </figure>        
      
        <figure id="ktm_kep">
            <img src="Kepek/ktm.jpg">
            <figcaption>KTM Duke 125</figcaption>
        </figure>    
      </div>
    </section>

<section id="elozmenyek">
    <h2>Szerviz előzmények</h2>

    <table>
        <thead>
            <tr>
                <th>Dátum</th>
                <th>Motor neve</th>
                <th>Kilométeróra</th>
                <th>Elvégzett művelet</th>
                <th>Költség</th>
            </tr>
        </thead>

        <tbody id="szerviz_adatok">
        </tbody>
    </table>
</section>

<section>
    <h2>Költségek járműre lebontva</h2>
    <h3>Összköltség: <span id="ossz"></span> Ft</h3>
    <p>Kawasaki Versys 650 <span style="font-weight: bold;" id="kawa_kolt"></span> Ft</p>

    <div class="diagram">
        <div id="kawa_diagram"></div>
    </div>

    <p>KTM Duke 125 <span style="font-weight: bold;" id="ktm_kolt"></span> Ft</p>
    <div class="diagram">
      <div id="ktm_diagram"></div>
    </div>
    
    
</section>

  </main>

  <footer>Szerviznapló – Készített: Végi László Péter Neptunkód: LJLU0N</footer>

</body>

</html>
